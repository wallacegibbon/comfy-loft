<!doctype html>
<html lang="en" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Comfy Loft — a local workbench for AI images, video and audio" />
        <link rel="icon" href="/logo.svg" />
        <title>Comfy Loft</title>
        <!--
            The theme is applied by the app, not here: the gateway writes the workspace preferences into
            /config.js (docs/decisions.md #155), so any script in this file would either duplicate that
            document or read a key nothing writes. `AppProviders` reads the store, which was initialised
            from that document before the first render.
        -->
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
